# The macro catalog: one entry per series, named by its e_* alias.
# attrs.stale marks a series that is not current, with the reason:
# - every series still on DBnomics, whose dataset was retired at the origin;
#   scripts/replace_dbnomics_ids.py looks for their replacement at the publisher;
# - a series at its publisher whose last period, on the day it was checked, was more than one
#   period behind the store's staleness threshold for its frequency (STALE_AFTER_DAYS in
#   store/model.py), so it is stale even after the publisher's next release. The note gives the
#   last period and the day of the check.
